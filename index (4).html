<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Rich · John Richmond</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;}
  #v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
  #c{position:fixed;inset:0;width:100%;height:100%;}
  #ld{position:fixed;inset:0;background:#0a0609;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:100;transition:opacity .8s;}
  #ld.done{opacity:0;pointer-events:none;}
  #ld h1{color:#f0e0bc;font-size:52px;font-style:italic;font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:.1em;}
  #ld p{color:#9a7a50;font-size:11px;letter-spacing:.25em;text-transform:uppercase;font-family:sans-serif;
    margin-top:20px;text-align:center;padding:0 30px;}
  .lbar{width:120px;height:1px;background:rgba(201,169,110,0.2);margin-top:24px;}
  .lbar-f{height:100%;background:#c9a96e;width:0%;transition:width .3s;}
  #ui{position:fixed;bottom:0;left:0;right:0;padding:0 0 44px;
    background:linear-gradient(to top,rgba(0,0,0,0.75)0%,transparent 100%);
    display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;}
  .un{font-size:42px;font-style:italic;font-weight:300;color:#f0e0bc;letter-spacing:.12em;
    font-family:'Cormorant Garamond',Georgia,serif;text-shadow:0 0 24px rgba(201,169,110,0.5);}
  .ub{font-size:10px;letter-spacing:.38em;color:#c9a96e;text-transform:uppercase;font-family:sans-serif;opacity:.85;}
  .ut{font-size:9px;letter-spacing:.22em;color:#9a7a50;text-transform:uppercase;font-family:sans-serif;}
  .corner{width:20px;height:20px;border-color:#c9a96e;border-style:solid;position:fixed;opacity:.5;}
  .corner.tl{top:16px;left:16px;border-width:1px 0 0 1px;}
  .corner.tr{top:16px;right:16px;border-width:1px 1px 0 0;}
  .corner.bl{bottom:16px;left:16px;border-width:0 0 1px 1px;}
  .corner.br{bottom:16px;right:16px;border-width:0 1px 1px 0;}
  #hint{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);
    font-size:11px;letter-spacing:.22em;color:rgba(201,169,110,0.55);text-transform:uppercase;
    font-family:sans-serif;pointer-events:none;text-align:center;transition:opacity .5s;}
  #hint.hide{opacity:0;}
  #snap{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);
    width:70px;height:70px;border-radius:50%;border:3px solid rgba(255,255,255,0.9);
    background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #snap:active{transform:translateX(-50%) scale(.92);}
  #si{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.9);}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;}
  #savedmsg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.75);color:#f0e0bc;font-size:13px;letter-spacing:.15em;
    padding:14px 28px;border:1px solid rgba(201,169,110,0.4);opacity:0;
    transition:opacity .3s;pointer-events:none;text-align:center;font-family:sans-serif;}
  #savedmsg.show{opacity:1;}
</style>
</head>
<body>
<div id="ld">
  <h1>Rich</h1>
  <p id="lp">Starting…</p>
  <div class="lbar"><div class="lbar-f" id="lf"></div></div>
</div>
<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div id="hint">Open your mouth to reveal the grill</div>
<div id="ui">
  <div class="ub">John Richmond</div>
  <div class="un">Rich</div>
  <div class="ut">Dare to be legendary</div>
</div>
<button id="snap"><div id="si"></div></button>
<div id="flash"></div>
<div id="savedmsg"></div>

<script type="module">
import {FaceLandmarker, FilesetResolver, DrawingUtils} from
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs';

const vid  = document.getElementById('v');
const can  = document.getElementById('c');
const ctx  = can.getContext('2d');
const lp   = document.getElementById('lp');
const lf   = document.getElementById('lf');
const ld   = document.getElementById('ld');
const hint = document.getElementById('hint');

let W,H,grillA=0,parts=[],frameN=0,hintHidden=false;
let landmarker=null, lastResult=null;
let VW=0,VH=0;

function resize(){can.width=W=window.innerWidth;can.height=H=window.innerHeight;}
resize();window.addEventListener('resize',resize);

function setSt(t,p){lp.textContent=t;lf.style.width=p+'%';}
function finish(){lf.style.width='100%';setTimeout(()=>ld.classList.add('done'),600);}

// ---- MediaPipe landmark indices for mouth ----
// Upper lip top: 13 (center), 312,311,310,415,308 (right), 78,191,80,81,82 (left)
// Key points we use:
// Mouth corners: 61 (left), 291 (right)
// Upper inner lip: 78,191,80,81,82,13,312,311,310,415,308
// Lower inner lip: 78,95,88,178,87,14,317,402,318,324,308
// Mouth open: distance between 13 (top) and 14 (bottom) vs face height

// MediaPipe returns normalized coords (0-1), mirrored for selfie
// video is CSS mirrored, so we un-mirror in mapping

function mp2c(lm){
  // lm.x is 0-1 normalized, already mirrored by mediapipe for selfie
  // video has transform:scaleX(-1) in CSS
  // So we need: x = lm.x * W (no extra flip needed since both cancel)
  return {x: lm.x * W, y: lm.y * H};
}

function getMouthOpenRatio(lms){
  const top  = lms[13];  // upper inner lip center
  const bot  = lms[14];  // lower inner lip center
  const noseT= lms[6];   // nose tip (approx face height ref top)
  const chin = lms[152]; // chin
  const faceH= Math.abs(chin.y - noseT.y) * H || 1;
  const gap  = Math.abs(bot.y - top.y) * H;
  return gap / faceH;
}

// Upper lip landmark indices (inner edge, left to right)
const UPPER_LIP = [78,191,80,81,82,13,312,311,310,415,308];
// Mouth corners
const MOUTH_L = 61;
const MOUTH_R = 291;

function drawGrill(lms, alpha){
  if(alpha < 0.01) return;

  const lc = mp2c(lms[MOUTH_L]);
  const rc = mp2c(lms[MOUTH_R]);

  // Upper lip arc points
  const ul = UPPER_LIP.map(i => mp2c(lms[i]));

  const gL = Math.min(lc.x, rc.x);
  const gR = Math.max(lc.x, rc.x);
  const gW = gR - gL;
  const gH = gW * 0.28;

  const letters = ['R','I','C','H'];
  const n = letters.length;
  const tW = gW / n;

  ctx.save();
  ctx.globalAlpha = alpha;

  // Clip to mouth opening shape
  ctx.beginPath();
  ctx.moveTo(ul[0].x, ul[0].y);
  for(let i=1;i<ul.length;i++) ctx.lineTo(ul[i].x, ul[i].y);
  ctx.lineTo(ul[ul.length-1].x, ul[ul.length-1].y + gH*1.2);
  ctx.lineTo(ul[0].x, ul[0].y + gH*1.2);
  ctx.closePath();
  ctx.clip();

  for(let i=0;i<n;i++){
    const tx = gL + i*tW;
    const gap = tW*0.04;

    // Tooth top follows upper lip arc
    const prog = (i+0.5)/n;
    const idx  = prog*(ul.length-1);
    const i0   = Math.min(Math.floor(idx), ul.length-2);
    const fr   = idx-i0;
    const ty   = ul[i0].y*(1-fr)+ul[i0+1].y*fr;

    // Gold gradient
    const g=ctx.createLinearGradient(tx,ty,tx,ty+gH);
    g.addColorStop(0,'#fff8b0');g.addColorStop(0.12,'#ffe55c');
    g.addColorStop(0.42,'#c9a96e');g.addColorStop(0.75,'#8a5e28');g.addColorStop(1,'#4a2c0a');
    ctx.fillStyle=g;ctx.shadowColor='rgba(255,200,60,0.3)';ctx.shadowBlur=5;
    rr(ctx,tx+gap,ty,tW-gap*2,gH,Math.min(tW*0.1,4));ctx.fill();

    // Shine
    const sh=ctx.createLinearGradient(tx,ty,tx,ty+gH*0.38);
    sh.addColorStop(0,'rgba(255,255,220,0.52)');sh.addColorStop(1,'rgba(255,255,220,0)');
    ctx.fillStyle=sh;ctx.shadowBlur=0;
    rr(ctx,tx+gap+tW*0.08,ty+2,tW*0.38,gH*0.3,2);ctx.fill();

    // Gap
    if(i>0){ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(tx,ty,gap*2,gH);}

    // Letter
    const fs=Math.max(gH*0.46,8);
    ctx.font=`900 ${fs}px Arial Black,Arial,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(40,20,3,0.5)';ctx.shadowBlur=0;
    ctx.fillText(letters[i],tx+tW/2+0.7,ty+gH*0.52+0.7);
    ctx.fillStyle='#fffce0';ctx.shadowColor='rgba(255,240,100,0.8)';ctx.shadowBlur=3;
    ctx.fillText(letters[i],tx+tW/2,ty+gH*0.5);
  }
  ctx.restore();

  // Top bar following upper lip curve
  ctx.save();ctx.globalAlpha=alpha;
  const bH=Math.max(gH*0.2,3);
  ctx.beginPath();
  ctx.moveTo(ul[0].x, ul[0].y-bH);
  for(let i=1;i<ul.length;i++) ctx.lineTo(ul[i].x, ul[i].y-bH);
  for(let i=ul.length-1;i>=0;i--) ctx.lineTo(ul[i].x, ul[i].y+1);
  ctx.closePath();
  const bg=ctx.createLinearGradient(gL,ul[0].y-bH,gL,ul[0].y+1);
  bg.addColorStop(0,'#ffe880');bg.addColorStop(0.5,'#c9a96e');bg.addColorStop(1,'#7a5020');
  ctx.fillStyle=bg;ctx.shadowColor='rgba(255,200,60,0.5)';ctx.shadowBlur=7;ctx.fill();
  for(let i=1;i<n;i++){ctx.fillStyle='rgba(90,55,10,0.4)';ctx.fillRect(gL+i*tW-1,ul[0].y-bH,2,bH+1);}
  ctx.restore();

  // Sparkle particles
  if(alpha>0.5&&frameN%7===0){
    const cx=(gL+gR)/2,cy=mp2c(lms[13]).y;
    for(let i=0;i<2;i++) parts.push({
      x:cx+(Math.random()-.5)*gW,y:cy,
      vx:(Math.random()-.5)*.6,vy:-(0.4+Math.random()*.8),
      life:1,decay:0.025+Math.random()*.015,size:.6+Math.random()*1.3
    });
  }
}

function drawParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.015;p.life-=p.decay;
    if(p.life<=0){parts.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=p.life*.7;
    ctx.fillStyle='#c9a96e';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}

// ---- Detection loop ----
let lastVideoTime=-1;
function detectLoop(){
  requestAnimationFrame(detectLoop);
  ctx.clearRect(0,0,W,H);

  if(landmarker && vid.readyState>=2 && vid.currentTime!==lastVideoTime){
    lastVideoTime=vid.currentTime;
    try{
      const r=landmarker.detectForVideo(vid, performance.now());
      lastResult=r.faceLandmarks&&r.faceLandmarks.length>0 ? r.faceLandmarks[0] : null;
    }catch(e){lastResult=null;}
  }

  if(lastResult){
    if(!hintHidden){hint.classList.add('hide');hintHidden=true;}
    const open=getMouthOpenRatio(lastResult);
    // Show grill when mouth open ratio > 0.06
    const target=open>0.06?Math.min((open-0.06)/0.05,1):0;
    grillA+=(target-grillA)*0.2;
    drawGrill(lastResult,grillA);
  } else {
    grillA*=0.85;
    if(hintHidden){hint.classList.remove('hide');hintHidden=false;}
  }

  drawParts();
  frameN++;
}

async function init(){
  setSt('Starting camera…',15);
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false
    });
    vid.srcObject=stream;
    await vid.play();
    await new Promise(r=>{const t=setInterval(()=>{if(vid.videoWidth){VW=vid.videoWidth;VH=vid.videoHeight;clearInterval(t);r();}},50);});
  }catch(e){setSt('Allow camera access & reload',0);return;}

  setSt('Loading MediaPipe…',40);
  try{
    const vision=await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm'
    );
    setSt('Loading face model…',65);
    landmarker=await FaceLandmarker.createFromOptions(vision,{
      baseOptions:{
        modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate:'GPU'
      },
      runningMode:'VIDEO',
      numFaces:1,
      minFaceDetectionConfidence:0.5,
      minFacePresenceConfidence:0.5,
      minTrackingConfidence:0.5,
    });
  }catch(e){setSt('Load error: '+e.message,80);setTimeout(finish,2000);detectLoop();return;}

  setSt('Ready',100);
  finish();
  detectLoop();
}

// Capture
document.getElementById('snap').addEventListener('click',()=>{
  const fl=document.getElementById('flash');
  fl.style.transition='none';fl.style.opacity='1';
  setTimeout(()=>{fl.style.transition='opacity .4s';fl.style.opacity='0';},80);
  const out=document.createElement('canvas');
  out.width=W;out.height=H;
  const oc=out.getContext('2d');
  oc.save();oc.translate(W,0);oc.scale(-1,1);
  oc.drawImage(vid,0,0,W,H);
  oc.restore();
  oc.drawImage(can,0,0);
  oc.font='italic 300 38px Cormorant Garamond,Georgia,serif';
  oc.fillStyle='rgba(240,224,188,0.92)';oc.textAlign='center';
  oc.fillText('Rich',W/2,H-60);
  oc.font='11px sans-serif';oc.fillStyle='rgba(154,122,80,0.85)';
  oc.fillText('JOHN RICHMOND',W/2,H-38);
  const a=document.createElement('a');a.href=out.toDataURL('image/jpeg',.92);a.download='rich.jpg';a.click();
  const m=document.getElementById('savedmsg');m.textContent='Photo saved';m.classList.add('show');
  setTimeout(()=>m.classList.remove('show'),2200);
});

init();
</script>
</body>
</html>
